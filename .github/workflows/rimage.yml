name: rimage

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE**"
  pull_request:
    paths-ignore:
      - ".gitignore"
      - "**.md"
      - "LICENSE**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            target-apt-arch: amd64
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            target-apt-arch: amd64
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            target-apt-arch: arm64
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            target-apt-arch: arm64
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            cross: false
            rustflags: -C target-feature=+crt-static
          - target: i686-pc-windows-msvc
            os: windows-2025
            cross: false
            rustflags: -C target-feature=+crt-static
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false
            rustflags: -A linker_messages
          - target: aarch64-apple-darwin
            os: macos-15
            cross: false

    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
      RUSTFLAGS: "-D warnings ${{ matrix.rustflags }}"

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up Ubuntu multiarch
        if: startsWith(matrix.os, 'ubuntu') && !matrix.cross && matrix.target-apt-arch != 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          readonly DISTRO_CODENAME=$(lsb_release -cs)
          readonly HOST_ARCH=$(dpkg-architecture -q DEB_HOST_ARCH)
          readonly TARGET_ARCH="${{ matrix.target-apt-arch }}"
          sudo dpkg --add-architecture "$TARGET_ARCH"
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          sudo tee /etc/apt/sources.list <<EOF
          deb [arch=$HOST_ARCH] http://azure.archive.ubuntu.com/ubuntu/ $DISTRO_CODENAME main restricted universe multiverse
          deb [arch=$HOST_ARCH] http://azure.archive.ubuntu.com/ubuntu/ $DISTRO_CODENAME-updates main restricted universe multiverse
          deb [arch=$HOST_ARCH] http://azure.archive.ubuntu.com/ubuntu/ $DISTRO_CODENAME-backports main restricted universe multiverse
          deb [arch=$HOST_ARCH] http://security.ubuntu.com/ubuntu/ $DISTRO_CODENAME-security main restricted universe multiverse
          deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $DISTRO_CODENAME main universe multiverse
          deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $DISTRO_CODENAME-updates main universe multiverse
          deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $DISTRO_CODENAME-backports main universe multiverse
          deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports/ $DISTRO_CODENAME-security main universe multiverse
          EOF

      - name: install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu') && !matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          # meson+ninja build dav1d from source for the musl and aarch64 GNU
          # targets, nasm assembles mozjpeg's x86 SIMD code
          packages=(ninja-build meson nasm pkg-config)
          if [[ "${{ matrix.target }}" == *-musl ]]; then
            packages+=(musl-tools "musl-dev:${{ matrix.target-apt-arch }}")
          fi
          if [[ "${{ matrix.target }}" == aarch64-unknown-linux-* ]]; then
            packages+=(qemu-user gcc-aarch64-linux-gnu "libc6:${{ matrix.target-apt-arch }}")
          fi
          if [[ "${{ matrix.target }}" == x86_64-unknown-linux-gnu ]]; then
            packages+=(libdav1d-dev)
          fi
          sudo apt-get -yq update
          sudo apt-get -yq install --fix-missing "${packages[@]}"

      - name: install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          # The GH Actions macOS image pre-taps aws/tap (and azure/bicep);
          # Homebrew >= 6 requires tap trust and warns on every brew call.
          # Nothing in this build uses these taps, so untap them first.
          brew untap aws/tap 2>/dev/null || true
          brew untap azure/bicep 2>/dev/null || true
          brew install llvm ninja nasm pkg-config dav1d || brew upgrade llvm ninja nasm pkg-config dav1d

      - name: install Windows dependencies
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install -y ninja nasm
          # static dav1d matches the +crt-static rustflag of the MSVC target;
          # dav1d-sys locates it through pkgconf from the same vcpkg install.
          # the runner images expose vcpkg only via VCPKG_INSTALLATION_ROOT,
          # there is no VCPKG_ROOT
          $triplet = if ('${{ matrix.target }}' -eq 'i686-pc-windows-msvc') { 'x86-windows-static' } else { 'x64-windows-static' }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "dav1d:$triplet" "pkgconf:x64-windows"
          "PKG_CONFIG=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\pkgconf\pkgconf.exe" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\$triplet\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          target: ${{ matrix.target }}

      - name: set up QEMU for cross emulation
        if: matrix.cross
        uses: docker/setup-qemu-action@v4

      - name: install cargo-nextest
        if: ${{ !matrix.cross }}
        uses: taiki-e/install-action@nextest

      - name: install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      # musl and cross-compiled GNU targets have no dav1d package to link
      # against; build a static dav1d with the target toolchain and point
      # pkg-config at it. x86_64-gnu uses the distro package instead.
      - name: build static dav1d for the target
        if: startsWith(matrix.os, 'ubuntu') && !matrix.cross && matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              prefix=/opt/dav1d-target
              export CC=musl-gcc
              ;;
            aarch64-unknown-linux-gnu)
              prefix=/opt/dav1d-target
              export CROSS_FILE=ci/meson/aarch64-gnu.ini
              ;;
          esac
          ci/build-dav1d.sh "$prefix" ${CROSS_FILE:-}
          {
            echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      - name: build release binary
        shell: bash
        env:
          RUSTFLAGS: "-D warnings ${{ matrix.rustflags }}"
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --all-features --target "${{ matrix.target }}"
          else
            cargo build --release --all-features
          fi

      - name: run code tests
        shell: bash
        env:
          RUSTFLAGS: "-D warnings ${{ matrix.rustflags }}"
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross test --release --all-features --target "${{ matrix.target }}" --no-fail-fast -- --test-threads=1
          else
            cargo nextest run --release --all-features --no-fail-fast
          fi

      - name: run doc tests
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        env:
          RUSTFLAGS: "-D warnings ${{ matrix.rustflags }}"
        run: |
          set -euo pipefail
          cargo test --release --all-features --doc

      - name: upload CLI binary
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: rimage-${{ matrix.target }}
          path: |
            target/${{ env.CARGO_BUILD_TARGET }}/release/rimage
            target/${{ env.CARGO_BUILD_TARGET }}/release/rimage.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          components: rustfmt, clippy

      - name: formatting check
        run: cargo fmt --all -- --check

      - name: install native dependencies
        run: |
          sudo apt-get -yq update
          sudo apt-get -yq install --fix-missing ninja-build nasm libdav1d-dev

      - name: Clippy check
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Keep the complete WASM configuration in one disabled job. Remove the
  # job-level `if` when the Emscripten build is ready to be enabled again;
  # enabling it also requires a dav1d build for the Emscripten target.
  wasm:
    name: wasm32-unknown-emscripten (disabled)
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: wasm32-unknown-emscripten
      CC: emcc
      CXX: em++

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          target: wasm32-unknown-emscripten

      - name: install Emscripten
        run: brew install emscripten

      - name: check WASM target
        shell: bash
        run: |
          set -euo pipefail
          cargo check --all-features
